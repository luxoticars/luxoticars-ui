# Publishes the Storybook to GitHub Pages so maintainers can review components
# in a browser without checking the repo out. The site tracks released
# versions, not every merge to main. It runs when a GitHub Release is
# published, and when someone starts it by hand (workflow_dispatch). It does
# not run on pull requests: a PR build only proved `npm ci && npm run
# build-storybook` works, which the author already runs locally (see
# CLAUDE.md), and `npm test` does not need it.
#
# Releases here are created by the Release workflow (changesets/action with
# create-github-releases). That workflow uses the built-in GITHUB_TOKEN, and
# GitHub does not start other workflows from events that token creates, so
# `release: published` never runs for those releases. Release calls this
# workflow (workflow_call) after a successful publish. `release: published`
# still covers a release created by a person or a custom token. Do not also
# create those releases with a custom token while Release keeps the call,
# or the site would deploy twice.
#
# This workflow does nothing until Pages is turned on for the repository:
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until then the deploy job fails with a "Pages site not found" style error.
#
# The "GitHub Actions" source is used rather than "Deploy from a branch" so the
# built Storybook never has to be committed. Branch deploys can only serve the
# repo root or /docs, which would mean checking ~7 MB of build output into git
# on every change.
#
# The upstream site is served from the custom domain https://ui.luxoticars.com.my
# (DNS: CNAME ui -> luxoticars.github.io). With the "GitHub Actions" source a
# CNAME file in the repo is ignored, so the domain is set under
# Settings -> Pages -> Custom domain, not in this repo.
#
# Forks: enable Pages the same way, then run this workflow by hand
# (Actions -> Storybook -> Run workflow). That publishes
# https://<your-user>.github.io/luxoticars-ui/ without touching the upstream
# site. A push to a fork's main does not deploy.
name: Storybook

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so Pages is never left
# serving a half-published build. A workflow_call from Release uses this same
# group, so a manual run waits for an in-progress release deploy, and the reverse.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      # Storybook emits relative asset paths, so the same build works at the
      # custom domain root and at a fork's /luxoticars-ui/ project sub-path
      # without a base URL setting.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
